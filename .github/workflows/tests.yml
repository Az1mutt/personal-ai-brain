name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

      - name: Offline Codex environment checks
        shell: pwsh
        run: ./scripts/codex/test-environment.ps1 -FixtureRoot (Join-Path $env:RUNNER_TEMP 'codex-environment-tests')
