[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-brain"
version = "0.1.0"
description = "Local-first personal agent platform and Project OS automation layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9"
]

[project.scripts]
personal-ai-brain = "personal_ai_brain.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
