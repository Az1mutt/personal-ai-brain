schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "homelab-persistent-readonly-runtime-verified"

current_gate: >
  The minimum v0.3 persistent manual read-only runtime is live and verified.
  Preserve its permission boundary and disposition existing source-state findings
  with their owners. Define and approve a separate bounded milestone before adding
  scheduling, notifications, integrations or autonomous behavior.

current_state: >
  The v0.2 deterministic Core Agent, Agent Registry, state integrity/schema/freshness
  validation, rollup proposals and machine snapshots remain read-only and unchanged.
  On 2026-09-24 the minimum v0.3 runtime was packaged as a digest-pinned Python
  Docker image and deployed with Compose on Homelab. The detached service uses
  restart unless-stopped; Docker is enabled at boot. It survives SSH termination
  and container recreation, with private lifecycle logs and per-run outputs in
  a host directory outside Git. The existing credential is a read-only file secret,
  not an image, environment or command-line secret. The container runs as the host
  owner with a read-only root, dropped capabilities and no network listener or
  Docker socket. Three explicit manual operations produce reports, proposals and
  snapshots. Local heartbeat liveness is separate from the last manual source-read
  result. Existing source validation errors produce findings, not a dead runtime.
  All 46 tests passed on Homelab. Live execution of all three operations read
  12 states across 8 projects, with 3 existing schema errors, 6 warnings and
  2 proposals; no source-read failures. An isolated invalid-credential probe
  returned source_read_failure while Docker remained healthy. A stopped probe
  returned runtime unavailable. Logs and snapshots survived container recreation.
  No scheduler, Telegram, n8n, MCP, LLM, remote-shell API or Project OS write
  capability was introduced. This completes the persistent manual runtime slice,
  not all future v0.3 scheduling/notification work or a long-duration reliability test.

exact_next_action: >
  Continue from docs/handoffs/CODEX_TO_CHATGPT.md and operate the existing service
  with scripts/runtime.sh. Have source-state owners disposition the three
  missing-field findings and two proposals without inventing facts or refreshing
  dates merely to silence warnings. Separately scope the next approved milestone;
  do not repeat bootstrap, token setup or the completed v0.2 acceptance.

blockers:
  - >
      Source-state health remains non-clean: three states omit required fields
      and six warnings identify old rollups or freshness-policy age. These are
      data-quality findings, not blockers to the verified runtime/read path.

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides project-map.yaml and durable Project/Workstream States consumed by Core Agent."
  - project: "Homelab & Media Stack"
    dependency: "Hosts the detached Docker runtime, existing credential and private persistent outputs."

important_open_loops:
  - "Disposition source-state findings with their owners; do not weaken validation or falsify freshness."
  - "Review the two generated rollup proposals; Homelab requires manual synthesis."
  - "Health describes the last manual source read, not continuous GitHub connectivity."
  - "Per-run private artifacts require manual retention management; lifecycle logs rotate."
  - "Whole-host reboot and long-duration reliability have not been exercised."
  - "Scheduling and low-noise notifications need a separate approved milestone."
  - "Evaluate n8n or a second agent only after the bounded base runtime is established."
  - "LLM/planner/orchestrator and PostgreSQL/pgvector/Ollama remain future layers."

portfolio:
  milestone: true
  signal: >
    Personal AI Brain now has a live persistent read-only Homelab runtime with
    manual reports/proposals/snapshots, secure file credential injection, durable
    local outputs and distinct runtime/source/data health. Autonomous writes and
    scheduling remain outside the implemented scope.

verification:
  last_verified: "2026-09-24"
  sources:
    - "Homelab: 46 tests passed (29 existing plus 17 runtime boundary tests)."
    - "Three live container jobs: 12 states / 8 projects; 3 errors / 6 warnings / 2 proposals; source_read_failures=0."
    - "Snapshot run 20260924T182758Z-00fab03b; outputs under ~/.local/state/personal-ai-brain/runtime."
    - "Fresh SSH and container recreation: healthy runtime, persistent snapshot/logs; Docker enabled at boot."
    - "Isolated dummy-credential run: source_read_failure exit 3, Docker healthy; stopped probe health exit 1."
    - "docs/homelab-runtime.md"
    - "docs/handoffs/CODEX_TO_CHATGPT.md"

sync:
  status: "synced"
  storage: ".project/state.yaml"
