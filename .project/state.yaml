status: "active"
phase: "watched-tautulli-reconciliation-component-verified"

current_gate: >
  The restart-safe Tautulli reconciliation runner is component-tested. The next
  separate acceptance must invoke the merged command against the live read-only
  Tautulli/Plex sources, bootstrap the Plex cursor at accepted history ID 38,
  confirm the accepted S09E06 observation remains a duplicate, and verify no
  outbound Plex or Trakt write or delivery.

current_state: >
  The persistent v0.3 read-only Core remains healthy with unchanged source-read
  credential, validators and manual operations. v0.4A adds a separate detached
  control worker, transport-independent strict request/capability layer, and
  private GitHub Issues as its first adapter. Six allowlisted read-only handlers
  provide runtime health, fresh Core health/snapshot/report/proposals and bounded
  redacted lifecycle logs. No generic command, shell, file path or Docker API is
  exposed. A separate Issues read/write credential has no Contents access; live
  metadata/Issues checks returned 200 and private Contents returned 403.
  Both credentials are injected as file secrets. The worker has a read-only Core
  state mount and its own private persistent audit directory. Fsynced request
  reservations plus a shared host lock prevent repeat execution and concurrent
  duplicates. Interrupted execution is not automatically retried. Result posting
  retries reuse saved data. Transport health and request findings are separate
  from process liveness. Default polling is 30 seconds with bounded backoff and
  server rate-limit deadlines. On 2026-09-25 all 85 tests passed. Internal live
  probes exercised all six capabilities, invalid requests, duplicate IDs, correlated
  private comments and issue closure. Core read 12 states with 3 errors, 6 warnings
  and 2 proposals. Audit survived worker recreation; replay after recreation did
  not change the original execution record. An isolated invalid-token worker
  reported auth failure/backoff while remaining alive. Independent ChatGPT connector
  acceptance then succeeded through private Issues #28 and #29: runtime.health
  returned runtime=available and core.health returned fresh source_status=findings
  with 12 states, 3 errors, 6 warnings and 2 proposals. Both returned matching
  request IDs and were closed by the Homelab worker. Watched Event Ledger v0.1
  adds four additive SQLite tables, deterministic observation deduplication,
  explicit rewatches and corrections, external event links, restart-safe delivery
  states, historical boundary suppression, and a pure read-only Plex/Tautulli
  normalizer. It adds no network writer and copies none of the completed 558
  historical Trakt events. All 104 tests passed on Linux on 2026-10-06. Applying
  the migration to a private copy of the current media.db left all four existing
  tables logically unchanged and created every new table empty.
  The first live observation acceptance then inserted exactly one Rick and Morty
  S09E06 event; replay created no duplicate and no delivery. The bounded Tautulli
  runner now reads only after a durable per-account cursor with safe overlap,
  uses read-only Plex metadata GUIDs, accepts only deterministic numeric TMDb
  identity, quarantines unresolved identity, and stops without advancing past an
  unsafe event. Event ingest precedes cursor advancement, so restart in between
  is recovered by source-event deduplication. It exposes one CLI command for the
  existing scheduler and adds no Plex or Trakt writer.

exact_next_action: >
  After merge, invoke watched-reconcile once on Homelab with the accepted Plex
  cursor watermark 38 and a private Plex token file. Verify S09E06 is a duplicate,
  cursor 38 persists, the ledger remains one event/one link/zero deliveries, and
  no Plex or Trakt write occurs. Schedule it only after this acceptance passes.

blockers: []

