schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "remote-work-submission-v01-internally-accepted"

current_gate: >
  Remote Work Submission v0.1 is internally accepted, merged and deployed.
  External ChatGPT connector acceptance remains pending: the project chat must
  independently submit a fresh work task and read its correlated terminal status.
  Whole-host reboot remains pending and outside this milestone. No model backend,
  task GitHub publication or broader execution capability is authorized.

current_state: >
  The existing private GitHub Issues transport now exposes strictly typed
  work.submit, work.status and work.cancel alongside the unchanged six read-only
  capabilities. The existing Issues credential is reused without new scope.
  Control hands off only the fixed Work Runner fixture contract through a bounded
  atomic inbox/outbox. Runner independently validates admission; task UUID/payload
  hash remains the execution idempotency boundary and control request UUID remains
  the invocation boundary. Submit waits at most two seconds for a response and
  reports durable handoff pending honestly; status returns only sanitized fields.
  The control container cannot access builder state/workspaces/publication token.
  Builder retains UID 999/GID 982 only, no sudo, no control token/audit access.
  One receiver child handles cancellation while the single worker executes.
  Task sandboxes see neither transport side, credentials, network nor Docker.
  All 174 tests passed, including original read-only control regressions.
  Live internal Issues #32-39 verified submit, identical duplicate, payload
  conflict rejection, unsupported task rejection, succeeded status and running
  cancellation followed by cancelled status. Administrative checks verified actual
  identity boundaries, all 18 sandbox checks, pending handoff through control
  restart and builder interruption without replay. Deployed code matches merged
  source; builder is active and control transport healthy. The existing durable
  deployment checkout was fast-forwarded; only builder/control were updated.
  Core and Media services were not redeployed. Review branches/worktree were
  removed. No external ChatGPT-originated acceptance has been performed for this
  milestone. No model, task publisher, listener, remote shell/filesystem API or
  deployment capability was added. Media remains parked and out of scope.

exact_next_action: >
  In the project ChatGPT chat, use its own GitHub connector with the fresh
  work.submit and work.status payloads in docs/handoffs/CODEX_TO_CHATGPT.md.
  Verify correlated comments, succeeded terminal task result and issue closure;
  record the external evidence before marking that gate complete. Stop implementation.

blockers: []

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides read-only source states and private Issues command/result transport; worker cannot write source content."
  - project: "Homelab & Media Stack"
    dependency: "Hosts Core and control containers, separate credentials and durable private audit."

important_open_loops:
  - "External ChatGPT connector acceptance of remote work remains pending; internal Codex Issues probes are not a substitute."
  - "Retain bounded transport inbox/outbox records (2048-entry cap) and execution deduplication truth; no automatic pruning."
  - "Whole-host reboot acceptance for Work Runner remains pending; service enablement/restart and SSH independence are verified."
  - "Runner retention is manual with a 256-record admission cap; preserve deduplication truth and unmerged task artifacts."
  - "Rotate/revoke the builder credential before 2026-12-09; existing Core/control expiry remains owner-managed."
  - "Media scheduling, Trakt delivery, ratings, deletes and Plex write-back are Homelab/Media-owned follow-ups; the Mortgully delivery remains ambiguity-gated."
  - "The completed 558/558 Trakt migration remains outside the ongoing Plex cursor and must not be replayed."
  - "Define v0.4B Media capability contracts and risk boundaries before enabling any media write action."
  - "Preserve the deduplication ledger; do not deploy independent ledgers for the same queue."
  - "Whole-host reboot, long-duration reliability and audit retention remain operator checks."
  - "Token expiry/revocation must be handled by the owner; transport health exposes failures."
  - "Resolve existing source findings with their owners without weakening validation or falsifying freshness."
  - "Media, Recipe, Telegram, n8n, MCP and write capabilities require separately approved milestones."
  - "LLM/planner/orchestrator and database/memory layers remain deferred."

portfolio:
  milestone: true
  signal: >
    Authorized private Issues callers can submit the fixed local fixture, query
    durable task truth and cancel without SSH. Internal deployment acceptance is
    complete; independent ChatGPT connector acceptance is pending. Execution
    remains offline, credential-free and bounded; Media remains parked.

