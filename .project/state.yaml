schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Core Agent v0.1"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "core-agent-v0.1-bootstrap"

current_gate: >
  Prove that a local read-only Core Agent can load the real Project OS map and
  states from GitHub, validate them deterministically, and generate a useful
  consolidated report without manual delta transport or state writes.

current_state: >
  The repository is being upgraded from an early local knowledge/RAG concept
  into a broader personal agent platform. The original PostgreSQL/pgvector/
  Ollama idea is retained as a future Memory & Knowledge subsystem. Core Agent
  v0.1 now has a Python package, a deliberately read-only GitHub Contents API
  adapter, Project OS discovery/validation logic, a CLI report command and
  automated tests. The agent does not use an LLM and cannot write GitHub state
  in v0.1.

exact_next_action: >
  Merge the Core Agent v0.1 bootstrap, then run the CLI against the real private
  personal-project-brain repository using a read-capable GITHUB_TOKEN. Validate
  the generated report and fix any schema/discovery mismatches before deploying
  the agent to the Homelab runtime.

blockers:
  - >
      A runtime with a read-capable GitHub token is required to exercise the
      private personal-project-brain repository end to end.
  - >
      Homelab migration closure should complete before the agent is deployed as
      a persistent service there; local/manual execution can happen earlier.

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides core/project-map.yaml and durable Project/Workstream States."
  - project: "Homelab & Media Stack"
    dependency: "Future persistent runtime host after migration closure."

important_open_loops:
  - "Run Core Agent v0.1 against the real private Project OS state."
  - "Decide the narrow Homelab deployment shape after migration closure."
  - "Add deterministic project-rollup derivation/validation after the read path is proven."
  - "Add scheduling/triggering after manual CLI execution is stable."
  - "Add Repo Steward and Career Evidence agents only after the Core Agent boundary is proven."
  - "Add an LLM/planner layer only where semantic judgment adds value."
  - "Retain PostgreSQL/pgvector/Ollama as a future Memory & Knowledge subsystem rather than a v0.1 dependency."

portfolio:
  milestone: true
  signal: >
    First implementation milestone for a local-first personal multi-agent
    platform: deterministic Project OS discovery, read-only GitHub integration,
    state validation and CLI reporting with test coverage and explicit autonomy
    boundaries.

verification:
  last_verified: "2026-09-09"
  sources:
    - "personal-ai-brain branch agent-platform/core-agent-v0.1"
    - "Project OS v0.2 Core refresh proving GitHub-based state transport"

sync:
  status: "synced"
  storage: ".project/state.yaml"
