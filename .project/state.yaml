status: "active"
phase: "work-runner-v01-local-acceptance-verified"

current_gate: >
  Work Runner v0.1 local acceptance is verified under its dedicated service
  identity. Complete Change/Review Lane CI and merge closure. Whole-host reboot
  remains explicitly pending on the shared Homelab; do not claim it from service
  restart. Remote submission, model integration and publication require separate
  milestones and are not enabled.

current_state: >
  The persistent personal-ai-brain-builder systemd service runs as non-login
  pab-builder UID 999 / GID 982 with only its own group and no sudo/Docker/LXD
  privileges. Root-owned stdlib-only runtime/profile and an offline approved
  personal-ai-brain seed support one strict versioned deterministic fixture.
  Each task has an independent workspace and private Bubblewrap user/PID/mount/
  IPC/network boundary, non-root task UID, no capabilities, read-only proc and
  Git metadata, bounded output/resources, and whole-process cleanup. Tasks cannot
  read Core/control/builder credentials, other workspaces or production state,
  or access the Docker socket, network or host root privileges.
  Atomic fsynced task records, canonical payload hashes, admission/execution locks,
  cancellation and conservative interrupted-state recovery prevent silent replay.
  Private workspace, log, patch, test result and machine result survive failure
  and restart. Emergency space and low-space admission protect durable failure
  evidence; device failure remains fail-closed. All 153 Linux tests passed.
  Live acceptance verified success, valid patch, duplicate/conflict handling,
  deadlines, cancellation, graceful restart, supervisor SIGKILL, child cleanup,
  fixture failure, low-space rejection and completion after SSH disconnect.
  The service is enabled at boot; whole-host reboot was not performed.
  Existing Core/control services and their deployment checkout were unchanged.
  Builder GitHub authentication remains a separate administrative boundary and
  its credential was not exposed to the service or sandbox. There is no remote
  ChatGPT submission, LLM backend, task publication or deployment automation.
  Media remains parked in Homelab/Media; its ambiguous Mortgully delivery and
  all Media semantics remain outside this milestone.

exact_next_action: >
  Complete PR/CI/merge closure for feat/work-runner-v01, then stop. Use the verified
  local runner and docs/work-runner-v01.md as the foundation for a separately
  approved next milestone; do not add remote submission, models or publication.

blockers: []

