schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "watched-event-ledger-v0.1-component-verified"

current_gate: >
  Watched Event Ledger v0.1 is component-tested and migration-safe on a private
  copy of the current media.db. The next separate acceptance must apply the
  additive migration with a backup, seed the private historical migration
  watermark, and verify one new read-only Plex observation without any Plex or
  Trakt write.

current_state: >
  The persistent v0.3 read-only Core remains healthy with unchanged source-read
  credential, validators and manual operations. v0.4A adds a separate detached
  control worker, transport-independent strict request/capability layer, and
  private GitHub Issues as its first adapter. Six allowlisted read-only handlers
  provide runtime health, fresh Core health/snapshot/report/proposals and bounded
  redacted lifecycle logs. No generic command, shell, file path or Docker API is
  exposed. A separate Issues read/write credential has no Contents access; live
  metadata/Issues checks returned 200 and private Contents returned 403.
  Both credentials are injected as file secrets. The worker has a read-only Core
  state mount and its own private persistent audit directory. Fsynced request
  reservations plus a shared host lock prevent repeat execution and concurrent
  duplicates. Interrupted execution is not automatically retried. Result posting
  retries reuse saved data. Transport health and request findings are separate
  from process liveness. Default polling is 30 seconds with bounded backoff and
  server rate-limit deadlines. On 2026-09-25 all 85 tests passed. Internal live
  probes exercised all six capabilities, invalid requests, duplicate IDs, correlated
  private comments and issue closure. Core read 12 states with 3 errors, 6 warnings
  and 2 proposals. Audit survived worker recreation; replay after recreation did
  not change the original execution record. An isolated invalid-token worker
  reported auth failure/backoff while remaining alive. Independent ChatGPT connector
  acceptance then succeeded through private Issues #28 and #29: runtime.health
  returned runtime=available and core.health returned fresh source_status=findings
  with 12 states, 3 errors, 6 warnings and 2 proposals. Both returned matching
  request IDs and were closed by the Homelab worker. Watched Event Ledger v0.1
  adds four additive SQLite tables, deterministic observation deduplication,
  explicit rewatches and corrections, external event links, restart-safe delivery
  states, historical boundary suppression, and a pure read-only Plex/Tautulli
  normalizer. It adds no network writer and copies none of the completed 558
  historical Trakt events. All 104 tests passed on Linux on 2026-10-06. Applying
  the migration to a private copy of the current media.db left all four existing
  tables logically unchanged and created every new table empty.

exact_next_action: >
  Run a separate live ledger acceptance: back up media.db, apply the additive
  migration, seed the private 558/558 Trakt migration high-water mark, normalize
  and ingest one genuinely new Plex observation, and verify exactly one ledger
  event with no outbound Plex or Trakt delivery.

blockers: []

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides read-only source states and private Issues command/result transport; worker cannot write source content."
  - project: "Homelab & Media Stack"
    dependency: "Hosts Core and control containers, separate credentials and durable private audit."

important_open_loops:
  - "Deploy and accept the additive ledger migration separately; v0.1 is component-tested but not live-deployed."
  - "Seed the private historical Trakt boundary before any reconciliation poll so the completed 558/558 migration cannot replay."
  - "Webhook/polling runtime, Trakt delivery client, ratings, deletes and Plex write-back remain unimplemented."
  - "Define v0.4B Media capability contracts and risk boundaries before enabling any media write action."
  - "Preserve the deduplication ledger; do not deploy independent ledgers for the same queue."
  - "Whole-host reboot, long-duration reliability and audit retention remain operator checks."
  - "Token expiry/revocation must be handled by the owner; transport health exposes failures."
  - "Resolve existing source findings with their owners without weakening validation or falsifying freshness."
  - "Media, Recipe, Telegram, n8n, MCP and write capabilities require separately approved milestones."
  - "LLM/planner/orchestrator and database/memory layers remain deferred."

portfolio:
  milestone: true
  signal: >
    The persistent read-only Core now has an externally accepted reusable Homelab
    control bridge with private Issues transport, strict capability boundaries,
    persistent audit and duplicate-execution protection. ChatGPT independently
    invoked runtime.health and core.health through the connector and received
    correlated Homelab results. No infrastructure or Project OS write capability
    exists. The watched-history foundation now has an additive canonical event
    ledger, deterministic deduplication and a fail-closed read-only Plex/Tautulli
    adapter, with no external write path enabled.

