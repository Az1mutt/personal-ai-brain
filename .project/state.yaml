schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Core Agent v0.1"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "core-agent-v0.1-real-data-validation"

current_gate: >
  Run the merged read-only Core Agent against the real private Project OS
  repository and verify that discovery, YAML parsing, attention handling and
  report generation work end to end on live state.

current_state: >
  Core Agent v0.1 is implemented and merged to main. The repository now contains
  a Python package, CLI, read-only GitHub Contents API adapter, Project OS
  discovery/validation logic, Markdown reporting, tests, CI, architecture/vision
  docs and this Project State. GitHub Actions test run #1 completed successfully
  on 2026-09-09. The agent intentionally has no GitHub write methods, no LLM
  planner, no scheduler and no database dependency yet. The earlier PostgreSQL/
  pgvector/Ollama concept remains reserved as a future Memory & Knowledge
  subsystem of the broader multi-agent platform.

exact_next_action: >
  Run `personal-ai-brain core-report` against
  Az1mutt/personal-project-brain using a read-capable GITHUB_TOKEN, inspect the
  generated live report, and fix any real-schema/discovery mismatches before
  persistent Homelab deployment.

blockers:
  - >
      A runtime with a read-capable GitHub token is required for the first
      end-to-end run against the private personal-project-brain repository.
  - >
      Persistent Homelab service deployment should wait for formal Homelab
      migration closure, although manual/local execution can happen before that.

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides core/project-map.yaml and durable Project/Workstream States."
  - project: "Homelab & Media Stack"
    dependency: "Preferred persistent runtime host after migration closure."

important_open_loops:
  - "Run Core Agent v0.1 against live private Project OS state."
  - "Fix any live schema/discovery mismatches found by that run."
  - "Add deterministic project-rollup derivation/validation in v0.2."
  - "Package/deploy to Homelab after migration closure."
  - "Add scheduling/triggering only after manual CLI execution is stable."
  - "Add Repo Steward and Career Evidence agents after the Core Agent boundary is proven."
  - "Add LLM/planner/orchestrator layers only where semantic judgment adds value."
  - "Retain PostgreSQL/pgvector/Ollama as a future Memory & Knowledge subsystem."

portfolio:
  milestone: true
  signal: >
    First working implementation milestone for a local-first personal multi-agent
    platform: deterministic Project OS discovery, read-only GitHub integration,
    state integrity checks, attention-aware reporting, CLI packaging and CI test
    coverage with explicit autonomy boundaries.

verification:
  last_verified: "2026-09-09"
  sources:
    - "personal-ai-brain PR #1: Bootstrap Core Agent v0.1"
    - "GitHub Actions workflow tests run #1: success"
    - "main merge commit 6fc0b993448773b3212fc3ae7d58676450bda72f"

sync:
  status: "synced"
  storage: ".project/state.yaml"
