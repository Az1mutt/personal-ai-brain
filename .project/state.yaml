schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "rollup-proposals-machine-snapshot-v0.2b"

current_gate: >
  Complete the remaining deterministic v0.2b state-model hardening: clearer
  Project State schema validation and configurable freshness policy, then run the
  read-only Core/report/proposal/snapshot stack against the real private Project
  OS when Igor is on his own PC or Homelab. Runtime deployment, LLM planning and
  write-capable autonomy remain intentionally out of scope for this gate.

current_state: >
  Personal AI Brain now has a read-only multi-agent platform foundation in main.
  Core Agent discovers and reports Project OS state; Agent Contract + Registry
  defines explicit agent responsibilities, tool/resource permissions, approvals
  and event boundaries; State Integrity detects deterministic multi-workstream
  rollup drift and hard conflicts. PR #5 added a deterministic RollupProposalEngine
  plus machine-readable Core snapshots. The proposal layer can update structural
  and freshness fields and can propagate phase/gate/next-action only when exactly
  one blocking workstream makes that derivation unambiguous. With multiple active
  blocking workstreams it explicitly requires semantic/manual synthesis instead
  of inventing a shared narrative. New CLI commands expose rollup proposals and
  JSON/YAML Core snapshots for future scheduler, n8n or orchestrator consumers.
  GitHub Actions run #16 passed before PR #5 was squash-merged. The platform still
  has no GitHub write capability, LLM planner, scheduler, database or persistent
  runtime dependency.

exact_next_action: >
  Add deterministic Project State schema validation and configurable freshness
  policy by attention/project class. After that, validate core-report,
  rollup-proposals and core-snapshot against the real private Project OS from
  Igor's own PC or Homelab before moving into persistent runtime work.

blockers:
  - >
      Live validation against the private personal-project-brain repository still
      requires a runtime with a read-capable GitHub token, but this remains an
      acceptance test rather than a blocker for environment-independent platform
      development.
  - >
      Persistent Homelab deployment waits for the server/runtime phase; current
      schema/policy work remains environment-independent.

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides project-map.yaml and durable Project/Workstream States consumed by Core Agent."
  - project: "Homelab & Media Stack"
    dependency: "Preferred persistent runtime host for later deployment, scheduling and local integrations."

important_open_loops:
  - "Run Core Agent against live private Project OS state from Igor's own PC or Homelab."
  - "Validate rollup-proposals against real Homelab and Recipe multi-workstream states."
  - "Validate core-snapshot JSON/YAML as the machine contract for future runtime/orchestrator consumers."
  - "Add clearer Project State schema validation."
  - "Add configurable freshness policy by attention/project class."
  - "Define the first real second agent, likely Repo Steward, after deterministic v0.2b hardening."
  - "Package/deploy to Homelab when runtime/deployment becomes the active gate."
  - "Add scheduling/events after manual agent execution is stable."
  - "Add LLM/planner/orchestrator layers only where semantic judgment adds value."
  - "Retain PostgreSQL/pgvector/Ollama as a future Memory & Knowledge subsystem."

portfolio:
  milestone: true
  signal: >
    The platform now produces deterministic integrity findings, read-only rollup
    repair proposals and machine-readable cross-project snapshots on top of an
    explicit agent contract/permission model, creating a clean interface for
    future automation and orchestration without premature autonomous writes.

verification:
  last_verified: "2026-09-17"
  sources:
    - "personal-ai-brain PR #3: Add Agent Contract and Registry foundation"
    - "personal-ai-brain PR #4: Add deterministic Project State integrity checks"
    - "personal-ai-brain PR #5: Add rollup proposals and machine-readable Core snapshots"
    - "GitHub Actions workflow tests run #16: success"
    - "main merge commit e93c2a0c04063ea852e60f6594bf10e99c1b61b2"

sync:
  status: "synced"
  storage: ".project/state.yaml"
