schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "homelab-runtime-v0.3-ready"

current_gate: >
  Run the complete read-only v0.2 platform against the real private Project OS
  from Igor's own PC or Homelab, resolve any real-data schema/policy mismatches,
  and then establish a persistent read-only Homelab runtime with safe secret
  handling, logs, health checks and controlled triggering.

current_state: >
  Personal AI Brain v0.2 is implementation-complete in main. Core Agent provides
  deterministic read-only Project OS discovery and reporting. Agent Contract +
  Registry defines agent responsibilities, inputs/outputs, tool/resource
  permissions, approvals and future event boundaries. State Integrity detects
  multi-workstream rollup drift and hard conflicts. RollupProposalEngine produces
  read-only deterministic repair proposals without inventing shared narratives
  when multiple blocking workstreams require semantic synthesis. Core snapshots
  expose machine-readable JSON/YAML for future runtime/orchestrator consumers.
  PR #6 completed the final pre-runtime quality layer: Project State v0.2 schema,
  type, scope and sync.storage validation plus attention-aware freshness policy,
  configurable YAML thresholds, deferred/parked/future noise suppression and
  per-project/workstream freshness overrides. GitHub Actions run #23 passed before
  PR #6 was squash-merged. The Core Agent still has no GitHub write capability,
  LLM planner, scheduler, database or autonomous execution path.

exact_next_action: >
  On Igor's own PC or Homelab, clone/pull personal-ai-brain, provide a read-only
  GitHub token for the private personal-project-brain repository, install the
  package, and run core-report, rollup-proposals and core-snapshot against live
  Project OS data. Capture any real-data findings and fix genuine schema/policy
  mismatches before Docker/persistent-service packaging.

blockers:
  - >
      The first live private-repository acceptance run requires access to Igor's
      own PC or Homelab plus a read-capable GitHub token; the current work laptop
      is intentionally not used for that runtime test.

  - >
      Persistent deployment details such as Docker layout, secret injection,
      scheduling and notifications remain deliberately unimplemented until the
      first real-data run confirms the read-only platform behaves as expected.

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides project-map.yaml and durable Project/Workstream States consumed by Core Agent."
  - project: "Homelab & Media Stack"
    dependency: "Preferred persistent runtime host for Docker, scheduling and local integrations."

important_open_loops:
  - "Run core-report against live private Project OS state."
  - "Run rollup-proposals against real Homelab and Recipe multi-workstream states."
  - "Validate core-snapshot JSON/YAML as the machine contract for future runtime/orchestrator consumers."
  - "Resolve any real-data schema/freshness mismatches discovered by the first live run."
  - "Design and implement Docker packaging for the Homelab runtime."
  - "Implement read-only GitHub secret injection without committing credentials."
  - "Add manual/scheduled trigger, run logs, health checks and low-noise notifications."
  - "Evaluate n8n as event/orchestration glue after the base runtime is reliable."
  - "Define the first real second agent, likely Repo Steward, after Core Agent runtime behavior is proven."
  - "Add LLM/planner/orchestrator layers only where semantic judgment adds value."
  - "Retain PostgreSQL/pgvector/Ollama as a future Memory & Knowledge subsystem."

portfolio:
  milestone: true
  signal: >
    Personal AI Brain now has a CI-tested read-only multi-agent platform core with
    explicit agent contracts/permissions, deterministic Project OS integrity and
    schema validation, attention-aware freshness policy, rollup repair proposals
    and machine-readable automation outputs. The project is ready to move from
    environment-independent platform design into a persistent Homelab runtime.

verification:
  last_verified: "2026-09-17"
  sources:
    - "personal-ai-brain PR #3: Add Agent Contract and Registry foundation"
    - "personal-ai-brain PR #4: Add deterministic Project State integrity checks"
    - "personal-ai-brain PR #5: Add rollup proposals and machine-readable Core snapshots"
    - "personal-ai-brain PR #6: Complete v0.2 state schema and freshness quality layer"
    - "GitHub Actions workflow tests run #23: success"
    - "main merge commit edeba8bf5c37689315b858aeb3413b722d5c2090"

sync:
  status: "synced"
  storage: ".project/state.yaml"
