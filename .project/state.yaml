schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "state-integrity-v0.2b"

current_gate: >
  Extend the deterministic Core platform from drift detection into reproducible
  rollup proposal/output and machine-readable snapshots, while keeping runtime
  deployment, LLM planning and write-capable autonomy out of scope until the
  underlying state model is proven.

current_state: >
  Personal AI Brain now has three working platform layers in main. Core Agent v0.1
  provides deterministic read-only Project OS discovery and reporting. Agent
  Contract + Registry defines explicit agent responsibilities, inputs/outputs,
  tool/resource permissions, approvals and event boundaries. State Integrity
  v0.2b now validates multi-workstream project rollups against the Project Map and
  active child states. It detects rollup/workstream declaration drift, missing
  active generated_from sources, rollups older than active workstreams, synced
  roots above unsynchronized children, and hard terminal-root versus active-child
  status conflicts. These findings are integrated into the normal core-report.
  GitHub Actions run #13 passed before PR #4 was squash-merged. The platform is
  still read-only and has no LLM framework, scheduler, database or persistent
  runtime dependency.

exact_next_action: >
  Implement deterministic rollup proposal/output plus machine-readable Core
  snapshot export. The goal is for Core to show what a corrected rollup should
  contain without writing it, and to expose findings/state in a structured format
  suitable for the later Homelab runtime, scheduler and orchestrator.

blockers:
  - >
      Live Core Agent validation against the private personal-project-brain
      repository still requires a runtime with a read-capable GitHub token, but
      this remains an acceptance test rather than a development blocker.
  - >
      Persistent Homelab deployment waits for the server/runtime phase; current
      contract and integrity work is intentionally environment-independent.

dependencies:
  - project: "Personal Project Brain / Project OS"
    dependency: "Provides project-map.yaml and durable Project/Workstream States consumed by Core Agent."
  - project: "Homelab & Media Stack"
    dependency: "Preferred persistent runtime host for later deployment, scheduling and local integrations."

important_open_loops:
  - "Run Core Agent against live private Project OS state from Igor's own PC or Homelab."
  - "Add deterministic rollup proposal/output without enabling writes."
  - "Add machine-readable Core snapshot output."
  - "Add clearer Project State schema validation after the real-state shape is exercised further."
  - "Define the first real second agent, likely Repo Steward, after the deterministic platform layer is stable."
  - "Package/deploy to Homelab when runtime/deployment becomes the active gate."
  - "Add scheduling/events after manual agent execution is stable."
  - "Add LLM/planner/orchestrator layers only where semantic judgment adds value."
  - "Retain PostgreSQL/pgvector/Ollama as a future Memory & Knowledge subsystem."

portfolio:
  milestone: true
  signal: >
    The platform now combines explicit agent contracts with deterministic
    cross-project state integrity checks, giving a reusable foundation for
    multi-agent coordination without relying on hidden chat context or premature
    autonomous writes.

verification:
  last_verified: "2026-09-17"
  sources:
    - "personal-ai-brain PR #3: Add Agent Contract and Registry foundation"
    - "personal-ai-brain PR #4: Add deterministic Project State integrity checks"
    - "GitHub Actions workflow tests run #13: success"
    - "main merge commit ed19bdf937a4ced7dfad1998b9b92847afcc5e7a"

sync:
  status: "synced"
  storage: ".project/state.yaml"
